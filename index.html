<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Radar Lite - Nigeria</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background: #0f172a;
            color: white;
        }
        header {
            background: #1e2937;
            padding: 15px 20px;
            text-align: center;
            border-bottom: 3px solid #3b82f6;
        }
        h1 { font-size: 2.2em; margin-bottom: 5px; }
        .subtitle { color: #94a3b8; }

        #map { height: calc(100vh - 60px); width: 100%; }

        .control-panel {
            position: absolute;
            top: 80px;
            right: 15px;
            background: rgba(30, 41, 55, 0.95);
            padding: 18px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            width: 320px;
            z-index: 1000;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }
        button:hover { background: #2563eb; }
    </style>
</head>
<body>
    <header>
        <h1>✈️ Flight Radar Lite</h1>
        <p class="subtitle">Project 13 - Live Flight Tracker over Nigeria</p>
    </header>

    <div id="map"></div>

    <div class="control-panel">
        <h2>Live Status</h2>
        <p id="status">Initializing map...</p>
        <p><strong>Region:</strong> Nigeria Airspace</p>
        <button onclick="fetchFlights()">🔄 Refresh Flights</button>
        <small style="display:block; margin-top:12px; color:#94a3b8;">
            Data from OpenSky Network API<br>
            Updates every 12 seconds
        </small>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
